
name: Build Vocab Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare website files
        run: |
          mkdir -p www
          shopt -s dotglob nullglob
          for item in *; do
            case "$item" in
              .git|.github|node_modules|android|www|package.json|capacitor.config.json|README.md)
                continue
                ;;
            esac
            cp -a "$item" www/
          done

      - name: Install dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Sync app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vocab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
